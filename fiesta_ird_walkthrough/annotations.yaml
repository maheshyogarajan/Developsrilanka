steps:
- step: 1
  title: Log in to eservices.ird.gov.lk
  what_customer_does: Open https://eservices.ird.gov.lk/, click LOGIN, pick 'Personal
    Tax Matters', enter your TIN as 'My tax reference number', enter your IRD PIN,
    type the CAPTCHA characters, click LOGIN.
  what_can_go_wrong: PIN may have expired (you'll be asked to reset it — pick a new
    8-digit PIN you'll remember). CAPTCHA can be hard to read — click refresh on the
    CAPTCHA if needed. Wrong TIN format will be rejected (it must be 9 digits).
  how_fiesta_helps: FIESTA stores your prior-year filing as a draft so you don't lose
    your work between IRD sessions. If your PIN gets reset, update your saved PIN
    in FIESTA settings so future sessions auto-prefill.
  ira_citation: Section 92 IRA (filing of return online via approved e-Services system)
  screenshot_url: /static/fiesta_ird_walkthrough/step_01.png
- step: 2
  title: Open Return of Income (e-Filing menu)
  what_customer_does: From the dashboard, navigate to 'e-Filing' or 'Return of Income'.
    The system shows your taxpayer profile and the available returns for each Year
    of Assessment (Y/A).
  what_can_go_wrong: If your Tax Type isn't registered as Individual Income Tax (IIT),
    you won't see the return option. Returning filers occasionally see a stale 'Tax
    Type effective from' date — ignore that; if you've filed before, you're registered.
  how_fiesta_helps: FIESTA computes your liability for the Y/A before you ever touch
    IRD — you arrive at the portal already knowing what to declare.
  ira_citation: Section 56 IRA (registration for tax)
  screenshot_url: /static/fiesta_ird_walkthrough/step_02.png
- step: 3
  title: Select assessment year (Y/A 2024-2025 for tax year 24/25)
  what_customer_does: Pick the Year of Assessment from the dropdown. For income earned
    1 April 2024 – 31 March 2025, select Y/A 2024-2025.
  what_can_go_wrong: Easy to pick the wrong year — IRD uses April-March Y/A. Don't
    pick the calendar year.
  how_fiesta_helps: FIESTA always shows you the Y/A label that matches the return
    you're about to file (e.g. '25/26' means Y/A 2025-2026, income earned April 2025–March
    2026).
  ira_citation: Section 19 IRA (year of assessment definition)
  screenshot_url: /static/fiesta_ird_walkthrough/step_03.png
- step: 4
  title: Confirm taxpayer profile
  what_customer_does: IRD shows your name, NIC, address, contact, occupation. Confirm
    these are current. Click 'Save & Continue' or 'Update' if anything needs correcting.
  what_can_go_wrong: Outdated address / phone is common. Banks linked from old accounts
    may show. Make a note of anything wrong; you can update via the 'Profile' menu
    but don't get sidetracked from the return itself.
  how_fiesta_helps: FIESTA stores your taxpayer profile and lets you keep it up to
    date in one place — your address-of-record on FIESTA mirrors what you've told
    IRD.
  ira_citation: Section 102 IRA (taxpayer duty to maintain accurate records)
  screenshot_url: /static/fiesta_ird_walkthrough/step_04.png
- step: 5
  title: Declare income sources
  what_customer_does: 'Enter your gross income by source: Employment Income (with
    PAYE certificate from employer), Business Income, Investment Income (interest
    from FDs, dividends), Rental Income, Foreign Income (remitted to Sri Lanka).'
  what_can_go_wrong: Forgetting foreign remittances is the most common error — these
    are taxable on a remittance basis. Mixing gross and net (always declare gross).
    Misclassifying business income as employment (means missed deductions).
  how_fiesta_helps: FIESTA's Remittance Ledger captures every foreign remittance the
    moment you log it — at year-end you have a single Rs total ready to enter. Categorise
    income by source as you earn it, not all at once at filing time.
  ira_citation: Sections 5-9 IRA (sources of assessable income)
  screenshot_url: /static/fiesta_ird_walkthrough/step_05.png
- step: 6
  title: Enter deductions (qualifying expenditure)
  what_customer_does: 'Claim deductions for qualifying expenditure: home-office portion
    of rent, payments to service providers, professional fees, business expenses.
    Each line needs a contractual basis or evidence.'
  what_can_go_wrong: 'Claiming deductions without documented contracts is the #1 cause
    of audit-disallowance. Mixing personal and business expenses. Over-claiming home-office
    portion (must reflect actual business use).'
  how_fiesta_helps: Every Service Agreement and Rental Agreement you generate in FIESTA
    becomes your audit-defence — the IRD asks 'where is the documented basis for this
    deduction?' and you point at the signed agreement.
  ira_citation: Section 6(1) IRA (qualifying expenditure incurred in producing assessable
    income)
  screenshot_url: /static/fiesta_ird_walkthrough/step_06.png
- step: 7
  title: Apply personal relief (LKR 1.8M for Y/A 24-25)
  what_customer_does: Apply the resident personal relief — LKR 1,800,000 for Y/A 2024-2025
    (was LKR 1,200,000 in prior years; check the current threshold). This reduces
    your assessable income before the bracket-rate computation.
  what_can_go_wrong: Non-residents don't qualify for personal relief. Forgetting to
    claim it leaves money on the table — it's not auto-applied in older portal versions.
  how_fiesta_helps: FIESTA's tax-bill engine applies personal relief automatically
    per Y/A — the projected savings you see already factor it in. No mental math at
    filing time.
  ira_citation: Section 51 IRA (residents qualifying for relief), Y/A 24-25 personal
    relief LKR 1,800,000
  screenshot_url: /static/fiesta_ird_walkthrough/step_07.png
- step: 8
  title: Apply tax credits (WHT + foreign tax)
  what_customer_does: Enter any Withholding Tax (WHT) already paid (5% on FD interest,
    14% on professional service payments) — IRD credits this against your liability.
    Foreign tax paid on the same income (double-tax avoidance) can also be credited
    subject to treaty rules.
  what_can_go_wrong: Missing WHT certificates = missed credit. Foreign tax credit
    requires evidence (foreign tax voucher). Claiming credit on income that wasn't
    remitted yet (foreign income is on remittance basis) is incorrect.
  how_fiesta_helps: FIESTA tracks every WHT certificate as it arrives; year-end the
    total is one click away.
  ira_citation: Section 84 IRA (foreign tax credits), Sections 85-90 IRA (withholding
    tax credits)
  screenshot_url: /static/fiesta_ird_walkthrough/step_08.png
- step: 9
  title: Review tax computation (bracket-by-bracket)
  what_customer_does: 'IRD shows the final computation: gross income minus deductions
    minus personal relief = chargeable income, then graduated rate brackets applied
    (6% / 12% / 18% / 24% / 30% / 36% for Y/A 24-25). Verify the numbers match what
    you expected.'
  what_can_go_wrong: If the IRD number differs significantly from your own calculation,
    something was entered wrong upstream. Don't sign yet — go back and reconcile.
  how_fiesta_helps: FIESTA's S12 Tax Bill shows the same bracket-by-bracket walk before
    you file. If FIESTA's number matches IRD's, you can sign with confidence.
  ira_citation: First Schedule IRA (graduated rate bands for resident individuals)
  screenshot_url: /static/fiesta_ird_walkthrough/step_09.png
- step: 10
  title: Confirm bank refund details (if refund expected)
  what_customer_does: 'If your WHT credits + foreign tax credits exceed your liability,
    you''re due a refund. Enter your bank account: BOC / People''s Bank / Commercial
    / Sampath account number for the credit. Use a savings account in your name.'
  what_can_go_wrong: Wrong digits = refund bounces and you wait 3+ months for re-issue.
    Joint accounts can cause delays. Foreign-currency accounts not accepted — must
    be LKR.
  how_fiesta_helps: FIESTA stores your bank-of-record after the first filing — next
    year it auto-fills.
  ira_citation: Section 116 IRA (refund of overpaid tax)
  screenshot_url: /static/fiesta_ird_walkthrough/step_10.png
- step: 11
  title: Declare and sign
  what_customer_does: 'Read the declaration: ''I declare that the information given
    in this return is true, correct and complete.'' Check the agreement box. Click
    SUBMIT.'
  what_can_go_wrong: Once submitted, amendments require a Revised Return (Section
    95 IRA). Don't sign if anything looks wrong — go back and fix first. Section 178
    IRA penalties apply to false declarations.
  how_fiesta_helps: FIESTA's attestation flow makes you sign the same declaration
    BEFORE you reach IRD — by the time you click SUBMIT on the IRD portal, you've
    already attested to FIESTA. No surprises.
  ira_citation: Section 92 IRA (declaration on return), Section 178 IRA (penalty for
    false statement)
  screenshot_url: /static/fiesta_ird_walkthrough/step_11.png
- step: 12
  title: Download acknowledgement
  what_customer_does: After submit, IRD shows an Acknowledgement Number and offers
    a PDF download. SAVE THIS. It's your proof of filing — keep for 7 years per Section
    120 IRA record-keeping.
  what_can_go_wrong: Forgetting to download. IRD's acknowledgement PDF email is sometimes
    delayed or filtered to spam. Upload the ack PDF back to FIESTA so we have it on
    file.
  how_fiesta_helps: FIESTA prompts you to upload the IRD acknowledgement PDF after
    filing — we store it for 7 years and it shows on your return history page. Year-on-year
    you have a full audit trail.
  ira_citation: Section 120 IRA (record-keeping requirements — 7 years)
  screenshot_url: /static/fiesta_ird_walkthrough/step_12.png
