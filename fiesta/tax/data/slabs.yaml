# Sri Lanka Personal Income Tax — version-pinned slab tables
#
# Single source of truth for all FIESTA tax bracket arithmetic.
# Used by both the authoritative engine AND the S0 preview module.
# Gazette update = edit this file. No code touch. No magic numbers in Python.
#
# Provenance:
#   - 24/25: extracted verbatim from
#     `sf-metadata/sfdx_project/force-app/main/default/flows/Scr_Tax_Computation_for_PRM.flow-meta.xml`
#     lines 912-922 (FML_gross_income_tax) and line 1131 (FMLTaxFreeAllowance, Tax_Year_ID=6).
#   - 25/26: CEO directive 2026-05-20 IST — dual-track structure (foreign 15% cap +
#     local progressive). Replaces the earlier single-track 5-band assumption.
#   - Senior-citizen extra relief: Inland Revenue Act §51, Rs 500K additional
#     for resident individuals aged 60+ (applies on top of personal relief).
#
# Currency: LKR (Sri Lankan Rupees). All amounts integer (no decimals — IRD
# gazette presents brackets as integers; the engine applies Decimal arithmetic
# downstream for tax = bracket_width * rate so cent precision is preserved).
#
# Single-track (24/25) bracket semantics:
#   - `up_to`: top of the band (inclusive). null = open-ended (top band).
#   - `rate`: marginal rate applied to the slice of taxable income in this band.
#   - Bracket walk: subtract personal relief first, then walk slabs in order.
#
# Dual-track (25/26) bracket semantics:
#   - `first_taxable_band`: Rs 1M @ 6% applied to FIRST Rs 1M of taxable income
#     regardless of source. Cycles ONCE (shared between foreign + local).
#   - `foreign_above_first_band.flat_rate`: 15% cap applied to the foreign-share
#     of taxable income above the first band.
#   - `local_above_first_band.brackets`: progressive 18/24/30/36 bands at
#     500K-wide intervals applied to the local-share of taxable income above
#     the first band.
#   - Source split: foreign_share = foreign_gross / (foreign_gross + local_gross)
#     applied to `remaining_taxable = taxable - 1M`.
#   - Conservative default: if income_source unknown / not set, treat as 100%
#     local (higher rates) — never accidentally apply 15% cap to local income.
#
# Validation gates before any edit:
#   - 24/25 must reproduce 5 SF-computed historic cases cent-for-cent
#     (regression oracle A, see tests/tax/test_engine_25_26.py)
#   - 25/26 must reproduce the CEO worked examples cent-for-cent (B11/B12/B13)

# Tax year keys use the YY_YY form (Python-identifier safe).
years:

  "24_25":
    # Source: SF Scr_Tax_Computation_for_PRM.flow-meta.xml lines 912-922
    # 6 bands at 500K width: 6/12/18/24/30/36
    # Single-track: foreign + local treated identically.
    structure: "single_track"
    personal_relief_lkr: 1200000
    senior_citizen_extra_relief_lkr: 0  # not differentiated in this SF flow version
    brackets:
      - up_to: 500000
        rate: 0.06
      - up_to: 1000000
        rate: 0.12
      - up_to: 1500000
        rate: 0.18
      - up_to: 2000000
        rate: 0.24
      - up_to: 2500000
        rate: 0.30
      - up_to: null     # open-ended
        rate: 0.36

  "25_26":
    # Source: CEO directive 2026-05-20 IST (FIESTA pre-deploy fix).
    # Dual-track: Rs 1M first taxable band (shared) at 6%, then split by source.
    # Foreign-sourced income above the first band: 15% MAXIMUM (flat cap).
    # Local-sourced income above the first band: progressive 18/24/30/36 at
    # 500K intervals.
    structure: "dual_track"
    personal_relief_lkr: 1800000
    senior_citizen_extra_relief_lkr: 500000
    first_taxable_band:
      up_to: 1000000  # Rs 1M of taxable income (after relief, after deductions) at 6% — shared
      rate: 0.06
    foreign_above_first_band:
      flat_rate: 0.15  # 15% MAXIMUM cap on foreign-sourced taxable above the first band
    local_above_first_band:
      brackets:  # progressive at 500K intervals; last band open-ended
        - up_to: 500000   # i.e. 1M-1.5M of taxable income
          rate: 0.18
        - up_to: 1000000  # 1.5M-2M of taxable income
          rate: 0.24
        - up_to: 1500000  # 2M-2.5M of taxable income
          rate: 0.30
        - up_to: null     # 2.5M+ of taxable income
          rate: 0.36

# --- end of slabs.yaml ---
