# _tier_d5_secret_rotation/secret_inventory.yaml
# ----------------------------------------------------------------------
# Tier D5 / F4 — 90-day secret rotation tracking + reminders (2026-05-24).
#
# CONTRACT
# --------
# This YAML is the SOURCE OF TRUTH for when each production secret was
# last rotated. After CEO rotates a secret (in the provider dashboard +
# `flyctl secrets set ...`), CEO MUST update the matching `last_rotated`
# field below and commit.
#
# The weekly probe (tasks/secret_rotation_probe.py) loads this file,
# computes age in days, and Telegram-alerts CEO via ops_alerts.send_alert
# when any secret is approaching or past its rotation window.
#
# THRESHOLDS (hardcoded in secret_rotation_check.py — keep this tight):
#   - >= (rotation_days - 15)  → WARN  (severity=LOW)
#   - >= rotation_days         → URGENT (severity=HIGH)
#   - < (rotation_days - 15)   → OK    (no alert)
#
# For the canonical 90d cadence, that means: WARN at 75d, URGENT at 90d.
# For 180d secrets: WARN at 165d, URGENT at 180d.
# For 365d secrets: WARN at 350d, URGENT at 365d.
#
# SCOPE
# -----
# Tracking + reminders ONLY. NO auto-rotation. Each provider has its own
# console-rotation flow; the `rotation_steps` block below documents it so
# the CEO doesn't have to context-switch when an alert fires.
#
# OWNERS
# ------
# - `ceo`    — CEO rotates manually (Stripe, SendGrid, Gemini, etc.)
# - `devops` — Rotated as part of infra change (Fly secrets file mounts,
#              session-secret rolls that invalidate user sessions).
#
# Dates are ISO-8601 (YYYY-MM-DD). last_rotated defaults to 2026-05-24
# (Tier D5 launch) where the actual rotation date is unknown — CEO
# should revise after the first review pass.

schema_version: 1
defaults:
  rotation_days: 90
  warn_lead_days: 15

secrets:
  # -------------------------------------------------------------------
  # PAYMENT / FINANCIAL — highest blast radius. 90d canonical.
  # -------------------------------------------------------------------
  - name: STRIPE_SECRET_KEY
    store: fly_secrets
    last_rotated: 2026-05-20
    rotation_days: 90
    owner: ceo
    description: "Stripe API live key (sk_live_*) — paywall + consultant + referral flows."
    rotation_steps:
      - "Stripe dashboard -> Developers -> API keys -> 'Roll secret key'"
      - "flyctl secrets set STRIPE_SECRET_KEY=sk_live_xxx -a fiesta-mvp"
      - "Update last_rotated in secret_inventory.yaml + commit"
      - "Smoke test: hit /paywall/checkout flow, verify 200"

  - name: STRIPE_PAYWALL_WEBHOOK_SECRET
    store: fly_secrets
    last_rotated: 2026-05-20
    rotation_days: 90
    owner: ceo
    description: "Stripe webhook signing secret for paywall events (whsec_*)."
    rotation_steps:
      - "Stripe dashboard -> Developers -> Webhooks -> select paywall endpoint -> Roll signing secret"
      - "flyctl secrets set STRIPE_PAYWALL_WEBHOOK_SECRET=whsec_xxx -a fiesta-mvp"
      - "Update last_rotated in secret_inventory.yaml + commit"

  - name: STRIPE_WEBHOOK_SECRET
    store: fly_secrets
    last_rotated: 2026-05-20
    rotation_days: 90
    owner: ceo
    description: "Legacy Stripe webhook signing secret (general fallback)."
    rotation_steps:
      - "Stripe dashboard -> Developers -> Webhooks -> general endpoint -> Roll signing secret"
      - "flyctl secrets set STRIPE_WEBHOOK_SECRET=whsec_xxx -a fiesta-mvp"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # EMAIL — 90d. SendGrid is the only outbound transport in prod.
  # -------------------------------------------------------------------
  - name: SENDGRID_API_KEY
    store: fly_secrets
    last_rotated: 2026-05-15
    rotation_days: 90
    owner: ceo
    description: "SendGrid API key — drives every outbound email path."
    rotation_steps:
      - "SendGrid dashboard -> Settings -> API Keys -> create new with Full Access"
      - "flyctl secrets set SENDGRID_API_KEY=SG.xxx -a fiesta-mvp"
      - "Smoke: trigger a test email, verify in SG activity feed"
      - "Delete the OLD key from SG dashboard"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # AI / EXTERNAL LLM — 90d.
  # -------------------------------------------------------------------
  - name: GEMINI_API_KEY
    store: fly_secrets
    last_rotated: 2026-05-15
    rotation_days: 90
    owner: ceo
    description: "Google Gemini API key — Stage B reasoner + Q&A + remittance import."
    rotation_steps:
      - "Google AI Studio -> API keys -> regenerate"
      - "flyctl secrets set GEMINI_API_KEY=xxx -a fiesta-mvp"
      - "Update last_rotated in secret_inventory.yaml + commit"

  - name: ZHIPU_API_KEY
    store: fly_secrets
    last_rotated: 2026-05-15
    rotation_days: 90
    owner: ceo
    description: "Zhipu/Z.AI key — GLM OCR fallback when Gemini is unavailable."
    rotation_steps:
      - "Z.AI console -> regenerate key"
      - "flyctl secrets set ZHIPU_API_KEY=xxx -a fiesta-mvp"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # STORAGE — 90d for app-touchable (S3 receipts); 180d for backup
  # (Tigris, infrequently used, blast radius isolated to DR).
  # -------------------------------------------------------------------
  - name: AWS_ACCESS_KEY_ID
    store: fly_secrets
    last_rotated: 2026-05-01
    rotation_days: 90
    owner: ceo
    description: "AWS S3 receipts bucket access key — paired with AWS_SECRET_ACCESS_KEY."
    rotation_steps:
      - "AWS IAM -> users -> fiesta-receipts -> Security credentials -> create new access key"
      - "flyctl secrets set AWS_ACCESS_KEY_ID=xxx AWS_SECRET_ACCESS_KEY=xxx -a fiesta-mvp"
      - "Smoke: upload a test receipt, verify it lands in S3"
      - "Disable then delete OLD key in IAM"
      - "Update last_rotated for BOTH AWS_* entries"

  - name: AWS_SECRET_ACCESS_KEY
    store: fly_secrets
    last_rotated: 2026-05-01
    rotation_days: 90
    owner: ceo
    description: "AWS S3 receipts bucket secret — paired with AWS_ACCESS_KEY_ID. Rotate together."
    rotation_steps:
      - "Rotated as part of AWS_ACCESS_KEY_ID rotation (see that entry)."

  - name: BACKUP_S3_ACCESS_KEY_ID
    store: fly_secrets
    last_rotated: 2026-05-24
    rotation_days: 180
    owner: devops
    description: "Tigris S3 access key for daily Postgres backup bucket. Lower frequency — backup path only."
    rotation_steps:
      - "Fly Tigris dashboard -> tokens -> create new for fiesta-mvp-pg-backups"
      - "flyctl secrets set BACKUP_S3_ACCESS_KEY_ID=xxx BACKUP_S3_SECRET_ACCESS_KEY=xxx -a fiesta-mvp"
      - "Trigger one manual pg_backup run, verify a new dated key appears in the bucket"
      - "Revoke OLD token"
      - "Update last_rotated for BOTH BACKUP_S3_* entries"

  - name: BACKUP_S3_SECRET_ACCESS_KEY
    store: fly_secrets
    last_rotated: 2026-05-24
    rotation_days: 180
    owner: devops
    description: "Tigris S3 secret for daily Postgres backup bucket. Rotated with BACKUP_S3_ACCESS_KEY_ID."
    rotation_steps:
      - "Rotated as part of BACKUP_S3_ACCESS_KEY_ID rotation (see that entry)."

  # -------------------------------------------------------------------
  # FLASK SESSION — 180d. Rotation logs out all users.
  # -------------------------------------------------------------------
  - name: SESSION_SECRET
    store: fly_secrets
    last_rotated: 2026-05-01
    rotation_days: 180
    owner: devops
    description: "Flask app.secret_key — signs session cookies + CSRF. Rotation invalidates all sessions."
    rotation_steps:
      - "Generate: python -c \"import secrets; print(secrets.token_urlsafe(48))\""
      - "flyctl secrets set SESSION_SECRET=xxx -a fiesta-mvp"
      - "Expected impact: all users logged out, must re-auth (one-time UX cost)"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # ALERTING — 365d. Telegram bot tokens rarely compromised; lower freq.
  # -------------------------------------------------------------------
  - name: TELEGRAM_BOT_TOKEN
    store: fly_secrets
    last_rotated: 2026-05-24
    rotation_days: 365
    owner: ceo
    description: "Telegram bot token for ops alerts (@CEO_OS_PRO_bot). Read-only alert path; rotates yearly."
    rotation_steps:
      - "Telegram BotFather -> /revoke -> select bot -> revoke current token"
      - "BotFather -> /token -> copy new"
      - "flyctl secrets set TELEGRAM_BOT_TOKEN=xxx -a fiesta-mvp"
      - "Smoke: invoke ops_alerts.send_alert from a Celery shell, verify message lands"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # OAUTH PROVIDERS — 365d. Client secrets (long-lived, regenerable).
  # -------------------------------------------------------------------
  - name: GOOGLE_CLIENT_SECRET
    store: fly_secrets
    last_rotated: 2026-05-01
    rotation_days: 365
    owner: ceo
    description: "Google OAuth client secret for social login."
    rotation_steps:
      - "Google Cloud Console -> APIs & Services -> Credentials -> regenerate secret"
      - "flyctl secrets set GOOGLE_CLIENT_SECRET=xxx -a fiesta-mvp"
      - "Smoke: complete a Google OAuth login flow"
      - "Update last_rotated in secret_inventory.yaml + commit"

  - name: FACEBOOK_CLIENT_SECRET
    store: fly_secrets
    last_rotated: 2026-05-01
    rotation_days: 365
    owner: ceo
    description: "Facebook OAuth app secret for social login."
    rotation_steps:
      - "Meta for Developers -> App -> Settings -> Basic -> Reset App Secret"
      - "flyctl secrets set FACEBOOK_CLIENT_SECRET=xxx -a fiesta-mvp"
      - "Smoke: complete a Facebook OAuth login flow"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # EXTERNAL INTEGRATIONS — 90d.
  # -------------------------------------------------------------------
  - name: FA_API_TOKEN
    store: fly_secrets
    last_rotated: 2026-05-15
    rotation_days: 90
    owner: ceo
    description: "FormAssembly REST API token — A&L push + form admin."
    rotation_steps:
      - "FormAssembly admin -> API Access -> generate new token"
      - "flyctl secrets set FA_API_TOKEN=xxx -a fiesta-mvp"
      - "Update last_rotated in secret_inventory.yaml + commit"
      - "Revoke OLD token in FA admin"

  - name: SF_JWT_PRIVATE_KEY
    store: fly_secrets
    last_rotated: 2026-05-01
    rotation_days: 365
    owner: devops
    description: "Salesforce JWT signing private key — paired with Connected App. Long-lived; rotated yearly."
    rotation_steps:
      - "Generate new RSA key: openssl genrsa -out sf_jwt_server.key 2048"
      - "Upload public half to SF Connected App"
      - "flyctl secrets set SF_JWT_PRIVATE_KEY=\"$(cat sf_jwt_server.key)\" -a fiesta-mvp"
      - "Smoke: hit a Salesforce-touching endpoint, verify auth works"
      - "Remove OLD public key from SF Connected App"
      - "Update last_rotated in secret_inventory.yaml + commit"

  # -------------------------------------------------------------------
  # DATABASE — 180d. NEON deprecated; Fly internal PG superseded it.
  # -------------------------------------------------------------------
  - name: DATABASE_URL
    store: fly_secrets
    last_rotated: 2026-05-24
    rotation_days: 180
    owner: devops
    description: "Fly internal Postgres connection string (fiesta-pg-bom.internal). NEON_DATABASE_URL is legacy."
    rotation_steps:
      - "flyctl postgres update -a fiesta-pg-bom (or rotate Postgres role password)"
      - "flyctl secrets set DATABASE_URL=postgres://... -a fiesta-mvp"
      - "Smoke: hit /healthz, verify DB reachable"
      - "Update last_rotated in secret_inventory.yaml + commit"
