<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .receipt {
      fill: #f8f9fa;
      stroke: #dee2e6;
      stroke-width: 2;
    }
    .receipt-line {
      stroke: #dee2e6;
      stroke-width: 1;
    }
    .receipt-text {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #6c757d;
    }
    .receipt-icon {
      fill: #6c757d;
    }
    .receipt-title {
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      fill: #6c757d;
      text-anchor: middle;
    }
    .receipt-subtitle {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #adb5bd;
      text-anchor: middle;
    }
  </style>
  
  <!-- Receipt Background -->
  <rect class="receipt" x="100" y="20" width="200" height="260" rx="5" ry="5" />
  
  <!-- Receipt Header -->
  <line class="receipt-line" x1="100" y1="60" x2="300" y2="60" />
  
  <!-- Receipt Title -->
  <text class="receipt-title" x="200" y="45">Receipt</text>
  
  <!-- Receipt Lines -->
  <line class="receipt-line" x1="120" y1="80" x2="280" y2="80" />
  <line class="receipt-line" x1="120" y1="100" x2="280" y2="100" />
  <line class="receipt-line" x1="120" y1="120" x2="280" y2="120" />
  <line class="receipt-line" x1="120" y1="140" x2="280" y2="140" />
  <line class="receipt-line" x1="120" y1="160" x2="280" y2="160" />
  
  <!-- Receipt Total Section -->
  <line class="receipt-line" x1="100" y1="200" x2="300" y2="200" />
  <text class="receipt-text" x="200" y="220" text-anchor="middle">Total</text>
  
  <!-- Receipt Footer -->
  <line class="receipt-line" x1="100" y1="240" x2="300" y2="240" />
  
  <!-- Image Not Available Message -->
  <text class="receipt-subtitle" x="200" y="180">Image Not Available</text>
</svg>