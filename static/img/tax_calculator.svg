<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Tax Calculator</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background -->
        <rect fill="#F8F9FA" x="0" y="0" width="200" height="200" rx="10"></rect>
        
        <!-- Calculator Body -->
        <rect fill="#4A5568" x="40" y="30" width="120" height="140" rx="8"></rect>
        <rect fill="#2D3748" x="50" y="45" width="100" height="35" rx="4"></rect>
        
        <!-- Calculator Display -->
        <rect fill="#EDF2F7" x="55" y="50" width="90" height="25" rx="2"></rect>
        
        <!-- Calculator Buttons -->
        <g transform="translate(50, 90)">
            <!-- Row 1 -->
            <rect fill="#CBD5E0" x="0" y="0" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="25" y="0" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="50" y="0" width="20" height="20" rx="3"></rect>
            <rect fill="#4299E1" x="75" y="0" width="20" height="20" rx="3"></rect>
            
            <!-- Row 2 -->
            <rect fill="#CBD5E0" x="0" y="25" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="25" y="25" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="50" y="25" width="20" height="20" rx="3"></rect>
            <rect fill="#4299E1" x="75" y="25" width="20" height="20" rx="3"></rect>
            
            <!-- Row 3 -->
            <rect fill="#CBD5E0" x="0" y="50" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="25" y="50" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="50" y="50" width="20" height="20" rx="3"></rect>
            <rect fill="#4299E1" x="75" y="50" width="20" height="20" rx="3"></rect>
            
            <!-- Row 4 -->
            <rect fill="#CBD5E0" x="0" y="75" width="20" height="20" rx="3"></rect>
            <rect fill="#CBD5E0" x="25" y="75" width="45" height="20" rx="3"></rect>
            <rect fill="#38B2AC" x="75" y="75" width="20" height="20" rx="3"></rect>
        </g>
        
        <!-- Tax Document -->
        <g transform="translate(120, 55)">
            <rect fill="#FFF" x="0" y="0" width="40" height="50" rx="2"></rect>
            <rect fill="#E2E8F0" x="5" y="10" width="30" height="2" rx="1"></rect>
            <rect fill="#E2E8F0" x="5" y="16" width="30" height="2" rx="1"></rect>
            <rect fill="#E2E8F0" x="5" y="22" width="30" height="2" rx="1"></rect>
            <rect fill="#E2E8F0" x="5" y="28" width="20" height="2" rx="1"></rect>
            
            <!-- Tax Symbol -->
            <text x="16" y="45" font-family="Arial" font-size="12" font-weight="bold" fill="#4A5568">RS</text>
        </g>
        
        <!-- Coins -->
        <circle fill="#F6E05E" cx="150" cy="120" r="12"></circle>
        <circle fill="#F6E05E" cx="165" cy="130" r="10"></circle>
        <circle fill="#F6E05E" cx="145" cy="135" r="8"></circle>
        
        <!-- Text Labels -->
        <text x="100" y="175" font-family="Arial" font-size="10" font-weight="bold" fill="#4A5568" text-anchor="middle">TAX SAVINGS CALCULATOR</text>
    </g>
</svg>