{% extends "layout.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <h1 class="mb-4 text-primary">
                        <i class="fas fa-info-circle fa-2x"></i>
                    </h1>
                    <h2 class="mb-4">Feature Unavailable</h2>
                    <p class="lead mb-4">The feature you're trying to access is currently unavailable or has been removed from the application.</p>
                    <p class="mb-5">Please navigate to one of our available features using the menu.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('receipt_history') }}" class="btn btn-primary me-2">
                            <i class="fas fa-history me-1"></i> Receipt History
                        </a>
                        <a href="{{ url_for('invoices') }}" class="btn btn-outline-primary">
                            <i class="fas fa-file-invoice-dollar me-1"></i> Invoices
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
