{% extends layout_template %}

{% block title %}Debug HTML{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>HTML Debug Tool</h1>
  <p>This page captures and displays the HTML content of another page for debugging purposes.</p>
  
  <div class="card">
    <div class="card-header">
      <h5 class="card-title">HTML Content</h5>
    </div>
    <div class="card-body">
      <pre id="html-content" style="max-height: 500px; overflow: auto;"></pre>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Fetch the expense report page
    fetch('/reports/expenses')
      .then(response => response.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        // Get all HTML content
        const htmlContent = document.getElementById('html-content');
        htmlContent.textContent = html;
        
        // Highlight specific areas
        const bodyContent = doc.querySelector('body');
        if (bodyContent) {
          console.log('Body content:', bodyContent.innerHTML);
        }
      })
      .catch(error => {
        console.error('Error fetching the page:', error);
      });
  });
</script>
{% endblock %}
