<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            padding: 0;
            margin: 0;
        }
    </style>

    {# Tier D6 / A2 — Paid-acquisition pixels (Meta + LinkedIn + Twitter).
       All three are env-gated; default-OFF behind PIXELS_ENABLED. See pixels.py. #}
    {% include 'components/pixels.html' %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Sprint 4 Tier B: FIESTA analytics beacon -->
    <script src="{{ url_for('static', filename='js/beacon.js') }}" defer></script>
    <!-- Sprint 4 Tier D4: FIESTA in-app feedback widget -->
    <script src="{{ url_for('static', filename='js/feedback_widget.js') }}" defer></script>
</body>
</html>
