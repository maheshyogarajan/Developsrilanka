<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Develop Sri Lanka - Receipt Scanner{% endblock %}</title>
    
    <!-- Bootstrap CSS basic -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    
    <style>
        .header {
            background-color: #fff;
            border-bottom: 1px solid #e9ecef;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem 0;
        }
        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6c757d;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .nav-link i {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        .nav-link:hover {
            background-color: #f8f9fa;
            color: #0d6efd;
        }
        .nav-link.active {
            background-color: #e9f0ff;
            color: #0d6efd;
            font-weight: bold;
        }
        .page-title {
            text-align: center;
            font-size: 1.5rem;
            margin: 0.5rem 0 1rem;
            color: #343a40;
        }
        .brand-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }
        .brand-link:hover {
            background-color: #f8f9fa;
        }
        .brand-logo {
            height: 40px;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-2">
                <a href="/" class="brand-link">
                    <img src="{{ url_for('static', filename='images/dev-sri-logo.jpg') }}" alt="Develop Sri Lanka Logo" class="brand-logo">
                </a>
                <nav>
                    <div class="nav-buttons">
                        <a href="{{ url_for('home') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                            <i class="fas fa-home"></i>
                            <span>Home</span>
                        </a>
                        {% if not current_user.is_authenticated %}
                        <a href="{{ url_for('preview') }}" class="nav-link {% if request.path == '/preview' %}active{% endif %}">
                            <i class="fas fa-eye"></i>
                            <span>Preview</span>
                        </a>
                        <a href="{{ url_for('login') }}" class="nav-link {% if request.path == '/login' %}active{% endif %}">
                            <i class="fas fa-sign-in-alt"></i>
                            <span>Login</span>
                        </a>
                        {% else %}
                        <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/scan' %}active{% endif %}">
                            <i class="fas fa-camera"></i>
                            <span>Scan</span>
                        </a>
                        <a href="{{ url_for('receipt_history') }}" class="nav-link {% if request.path == '/history' %}active{% endif %}">
                            <i class="fas fa-history"></i>
                            <span>History</span>
                        </a>
                        <a href="{{ url_for('analytics') }}" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">
                            <i class="fas fa-chart-pie"></i>
                            <span>Analytics</span>
                        </a>
                        <a href="{{ url_for('tax_savings') }}" class="nav-link {% if request.path == '/tax-savings' %}active{% endif %}">
                            <i class="fas fa-calculator"></i>
                            <span>Tax Savings</span>
                        </a>
                        <a href="{{ url_for('profile') }}" class="nav-link {% if request.path == '/profile' %}active{% endif %}">
                            <i class="fas fa-user"></i>
                            <span>Profile</span>
                        </a>
                        {% endif %}
                    </div>
                </nav>
            </div>
            <h1 class="page-title" id="page-title">Develop Sri Lanka</h1>
        </div>
    </header>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-4 bg-light">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start">
                    <p class="mb-0">&copy; 2025 Develop Sri Lanka. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-decoration-none text-muted me-3">
                        <i class="fab fa-facebook"></i>
                    </a>
                    <a href="#" class="text-decoration-none text-muted me-3">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="#" class="text-decoration-none text-muted">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
