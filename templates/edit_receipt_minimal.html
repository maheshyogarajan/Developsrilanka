{% extends 'layout.html' %}

{% block title %}Edit Receipt (Minimal){% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Receipt (Minimal Version)</h2>
    <p>Receipt ID: {{ receipt.id }}</p>
    <p>Vendor: {{ receipt.vendor_name }}</p>
    <p>Date: {{ receipt.date }}</p>
    <p>Amount: {{ receipt.total_amount }}</p>
    
    <form action="{{ url_for('unified_view.process_receipt_update', receipt_id=receipt.id) }}" method="POST">
        <div class="form-group">
            <label>Vendor Name</label>
            <input type="text" class="form-control" name="vendor_name" value="{{ receipt.vendor_name }}">
        </div>
        
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
{% endblock %}
