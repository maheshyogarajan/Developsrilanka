{% extends 'layout.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col">
            <a href="{{ url_for('clients.list_all_clients') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back to Clients
            </a>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header bg-white">
            <h5 class="mb-0">Edit Client</h5>
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('clients.edit_client', client_id=client[0]) }}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Client Name*</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ client[1] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="organization_id" class="form-label">Organization</label>
                        <select class="form-select" id="organization_id" name="organization_id">
                            <option value="">Select Organization</option>
                            {% for org in organizations %}
                                <option value="{{ org[0] }}" {% if client[10] == org[0] %}selected{% endif %}>
                                    {{ org[1] }} {% if org[2] %}(Default){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="company_name" class="form-label">Company Name</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" value="{{ client[2] or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label for="contact_person" class="form-label">Contact Person</label>
                        <input type="text" class="form-control" id="contact_person" name="contact_person" value="{{ client[3] or '' }}">
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ client[4] or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" value="{{ client[5] or '' }}">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3">{{ client[6] or '' }}</textarea>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="tax_registration_number" class="form-label">Tax Registration Number</label>
                        <input type="text" class="form-control" id="tax_registration_number" name="tax_registration_number" value="{{ client[7] or '' }}">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ client[8] or '' }}</textarea>
                </div>
                
                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('clients.list_all_clients') }}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Client</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
