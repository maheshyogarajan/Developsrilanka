{% extends "layout.html" %}

{% block title %}Admin Area - {{ super() }}{% endblock %}

{% block head %}
{{ super() }}
<style>
    .admin-sidebar {
        background-color: #343a40;
        padding: 20px 0;
        color: #fff;
        height: 100%;
        min-height: calc(100vh - 60px);
    }
    
    .admin-sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        padding: 10px 20px;
        margin-bottom: 5px;
        border-radius: 0;
        display: flex;
        align-items: center;
    }
    
    .admin-sidebar .nav-link:hover {
        color: #fff;
        background-color: rgba(255, 255, 255, 0.1);
    }
    
    .admin-sidebar .nav-link.active {
        color: #fff;
        background-color: #007bff;
    }
    
    .admin-sidebar .nav-link i {
        width: 24px;
        margin-right: 10px;
    }
    
    .admin-content {
        padding: 20px;
    }
    
    .admin-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 d-md-block admin-sidebar collapse">
            <h5 class="p-3 text-center">Admin Panel</h5>
            <div class="border-top mb-4"></div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{{ url_for('admin_dashboard') }}" class="nav-link {% if request.path == '/admin' %}active{% endif %}">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('admin_users') }}" class="nav-link {% if request.path == '/admin/users' %}active{% endif %}">
                        <i class="fas fa-users"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('admin_statistics') }}" class="nav-link {% if request.path == '/admin/statistics' %}active{% endif %}">
                        <i class="fas fa-chart-bar"></i> Statistics
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('admin_settings') }}" class="nav-link {% if request.path == '/admin/settings' %}active{% endif %}">
                        <i class="fas fa-cogs"></i> Settings
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('admin_logs') }}" class="nav-link {% if request.path == '/admin/logs' %}active{% endif %}">
                        <i class="fas fa-clipboard-list"></i> Logs
                    </a>
                </li>
                <li class="nav-item mt-4">
                    <a href="{{ url_for('home') }}" class="nav-link">
                        <i class="fas fa-arrow-left"></i> Back to Site
                    </a>
                </li>
            </ul>
        </div>
        
        <!-- Main content -->
        <div class="col-md-9 col-lg-10 admin-content">
            {% block admin_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
