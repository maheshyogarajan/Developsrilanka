{% extends "layout.html" %}

{% block title %}Upload Bank Statement{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-upload me-2"></i>Upload Bank Statement
                    </h4>
                </div>
                <div class="card-body">
                    <form id="uploadForm" method="POST" enctype="multipart/form-data" action="{{ url_for('enhanced_bank.upload_statement') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <!-- Organization Selection -->
                        <div class="mb-3">
                            <label for="organization_id" class="form-label">Organization</label>
                            <select class="form-select" id="organization_id" name="organization_id" required>
                                <option value="">Select Organization</option>
                                {% for org in organizations %}
                                <option value="{{ org.id }}" {% if org.id == selected_org_id %}selected{% endif %}>
                                    {{ org.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <!-- File Upload -->
                        <div class="mb-3">
                            <label for="statement_file" class="form-label">Bank Statement PDF</label>
                            <input type="file" class="form-control" id="statement_file" name="statement_file" 
                                   accept=".pdf" required>
                            <div class="form-text">
                                Upload your bank statement in PDF format. Maximum file size: 10MB.
                            </div>
                        </div>
                        
                        <!-- Statement Details -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="bank_name" class="form-label">Bank Name</label>
                                    <input type="text" class="form-control" id="bank_name" name="bank_name" 
                                           placeholder="e.g., Commercial Bank of Ceylon">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="account_number" class="form-label">Account Number (Last 4 digits)</label>
                                    <input type="text" class="form-control" id="account_number" name="account_number" 
                                           placeholder="e.g., 1234" maxlength="4">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="statement_start_date" class="form-label">Statement Start Date</label>
                                    <input type="date" class="form-control" id="statement_start_date" name="statement_start_date">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="statement_end_date" class="form-label">Statement End Date</label>
                                    <input type="date" class="form-control" id="statement_end_date" name="statement_end_date">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Currency Selection -->
                        <div class="mb-3">
                            <label for="base_currency" class="form-label">Currency</label>
                            <select class="form-select" id="base_currency" name="base_currency">
                                <option value="LKR">Sri Lankan Rupee (LKR)</option>
                                <option value="USD">US Dollar (USD)</option>
                                <option value="EUR">Euro (EUR)</option>
                                <option value="GBP">British Pound (GBP)</option>
                            </select>
                        </div>
                        
                        <!-- Processing Options -->
                        <div class="card bg-light mb-3">
                            <div class="card-body">
                                <h6 class="card-title">Processing Options</h6>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="auto_reconcile" name="auto_reconcile" checked>
                                    <label class="form-check-label" for="auto_reconcile">
                                        Enable automatic reconciliation with existing transactions
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="create_gl_entries" name="create_gl_entries" checked>
                                    <label class="form-check-label" for="create_gl_entries">
                                        Create general ledger entries automatically
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary" id="uploadBtn">
                                <i class="fas fa-upload me-2"></i>Upload and Process Statement
                            </button>
                            <a href="{{ url_for('enhanced_bank.list_statements') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Back to Statements
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Progress Card (Hidden by default) -->
            <div class="card mt-3" id="progressCard" style="display: none;">
                <div class="card-body">
                    <h6>Processing Bank Statement...</h6>
                    <div class="progress mb-2">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             id="progressBar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div id="progressText">Uploading file...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('uploadForm').addEventListener('submit', function(e) {
    const progressCard = document.getElementById('progressCard');
    const uploadBtn = document.getElementById('uploadBtn');
    
    progressCard.style.display = 'block';
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
});
</script>
{% endblock %}
