# Staging deploy — auto-deploys to fiesta-mvp-staging on every push to main,
# after CI passes.
# Created by tier-d5/f3-cicd (SUB-D5 INFRA, 2026-05-24).

name: Deploy (staging)

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: flyctl deploy → staging
    runs-on: ubuntu-latest
    # Only run when triggered by push (always) or when the upstream CI run succeeded.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.staging.toml --remote-only
