- q: "How do I pay tax to IRD?"
  a: |
    Payment options (all routed via IRD):
    1. RAMIS portal: log in with TIN + PIN, navigate to "Pay Tax",
       select the relevant return type and year, enter amount, and pay
       via debit/credit card or fund transfer.
    2. Online banking: most major SL banks (Sampath, Commercial, HNB,
       DFCC, BOC) have an IRD bill-payment option — use your TIN as
       the reference.
    3. Bank branch: walk into any branch with your TIN, ask for an IRD
       payment slip, pay cash or by cheque.
    4. IRD office: pay directly at any IRD office.
    Keep the payment receipt — you may need to attach it to your return
    (especially if there's a payment dispute later). Quarterly installment
    payment dates are 15 August, 15 November, 15 February, 15 May; final
    balance is due 30 September following year-end.
  tags: [pay, payment, IRD, RAMIS, bank, quarterly, deadline]
  source_refs: []

- q: "What is the GIG worker provision?"
  a: |
    There is no specific "gig worker" provision in the current Sri Lankan
    Inland Revenue Act — gig / freelance / platform-based income is
    treated as either:
    - Foreign-sourced personal income (if the platform / client is
      foreign), taxed under the 15% rule if remitted via SL bank, or
      progressive rates otherwise.
    - Sri Lankan business income (if you have a registered business),
      taxed under the business income provisions with allowable expenses.
    For most individual gig workers (Upwork, Fiverr, Toptal, Uber Eats
    delivery, PickMe driver), the simplest classification is "personal
    foreign income" if it's USD-denominated platform income, or "personal
    business income" if it's LKR-denominated SL gig income.
    FIESTA classifies based on your inputs and routes ambiguous cases to
    Lanka.tax for a human opinion.
  tags: [gig, freelance, Uber, PickMe, Upwork, Fiverr, classification]
  source_refs: []

- q: "What if my income drops mid-year? Can I revise installments?"
  a: |
    Yes. Quarterly installment payments are estimates based on the prior
    year's tax or your own projected income for the current year. If
    your income drops materially mid-year, you can revise the remaining
    installments downward.
    Two paths:
    1. Reduce the next installment payment proactively — calculate your
       revised expected annual tax and pay 1/4 of it (or the residual)
       at each remaining installment date.
    2. File a revised estimate with IRD (via RAMIS) to formalise the
       reduction and avoid an "under-installment" penalty enquiry.
    Conversely, if income RISES mid-year, you should top up installments
    upward — under-payment of installments can attract a penalty even
    if your final annual return is correct and paid on time.
    FIESTA's tax bill module shows your projected annual tax and the
    installment schedule that aligns to it.
  tags: [installment, quarterly, revise, income drop, projection]
  source_refs: []

- q: "How do I know if FIESTA's answer is right for my specific case?"
  a: |
    FIESTA's calculator and copilot apply the published Sri Lankan tax
    law to the inputs you provide. For mainstream cases (employment +
    standard foreign income + standard deductions), the computation
    matches IRD's own logic.
    For complex / unusual cases — DTA application, mixed residency years,
    cryptocurrency, partnership/JV income, multi-jurisdiction property,
    inherited assets — there's no substitute for a human tax adviser.
    FIESTA's copilot will flag complex cases and route them to a human
    at Lanka.tax via the in-app handoff. You can also submit the
    feedback widget (bottom-right of every page) with "confusion" if you
    feel an answer doesn't match your situation — we review every
    feedback within 1 business day.
    The lawyerly version: FIESTA is decision-support software, not legal
    or tax advice. Final responsibility for the return you submit rests
    with you.
  tags: [accuracy, advice, complex case, human, escalate, disclaimer]
  source_refs: [lanka_tax_handoff.md]

- q: "Why is the foreign income 15% rate 'final'?"
  a: |
    "Final" in tax means: once the 15% has been paid (via withholding or
    direct payment to IRD), the income is not added to your other income
    for further tax computation. It does NOT flow through your
    progressive brackets.
    Why this matters in practice:
    - Without "final" treatment, foreign income would be added to your
      employment / domestic income, potentially pushing you into the
      36% top bracket on the combined amount.
    - With "final" 15%, the foreign income is taxed at exactly 15%
      regardless of how much other income you have. This is the
      core benefit PN/IT/2025/01 created.
    The trade-off: you cannot then claim qualifying payment deductions
    against the 15%-taxed foreign income. Deductions only reduce the
    progressive-bracket portion of your income.
  tags: [final tax, 15%, PN IT 2025 01, foreign income, brackets, deductions]
  source_refs: [pn_it_2025_01_overview.md]

- q: "Can I get a tax refund?"
  a: |
    Yes, in two main scenarios:
    1. Over-withholding via APIT: your employer withheld more than your
       actual annual tax liability. The excess is refunded via IRD.
    2. Quarterly installments exceeded your final tax: same principle —
       the excess paid is refunded.
    Process: file your return showing the refund due. IRD processes
    refunds via direct credit to the bank account on your TIN file. The
    process can take several months (sometimes longer) — refunds are
    not IRD's priority.
    To accelerate: ensure your TIN file has up-to-date bank details,
    file as early as possible after the year-end, and follow up via
    RAMIS messages if a refund is overdue beyond 90 days.
  tags: [refund, over withholding, APIT, installments, claim, RAMIS]
  source_refs: []

- q: "What if I switched bank accounts mid-year?"
  a: |
    No tax consequence. The bank account is just a conduit for the
    inward remittance — what matters for tax is (a) the income is
    foreign-sourced, (b) it was remitted into a Sri Lankan licensed
    commercial bank account in your name, (c) you have the inward-
    remittance certificate.
    For FIESTA practical purposes: upload statements from BOTH the old
    and new account covering the year of assessment. The system
    aggregates remittances across all your accounts into one foreign
    income figure. You don't need to consolidate the accounts at the
    bank — keep them open through the filing year so you can pull
    historic statements if IRD audits later.
  tags: [bank account, change account, switch bank, multiple accounts]
  source_refs: []

- q: "Does Sri Lanka have a tax on cryptocurrency capital gains?"
  a: |
    The tax treatment of cryptocurrency gains in Sri Lanka is still
    evolving and not yet specifically codified. Current practice under
    the Inland Revenue Act:
    - Crypto trading gains (buy low, sell high) by an individual are
      generally treated as "investment income" or "business income"
      depending on frequency / scale.
    - Crypto received as payment for services is "income from services"
      taxed in the year received (at LKR-equivalent value on the
      receipt date).
    - Crypto gifts and inherited crypto: separate rules; depend on
      donor / deceased's residency.
    There is no specific "capital gains tax on crypto" in SL at this
    time, but IRD has signalled that crypto-related rules will be
    clarified in upcoming amendments. FIESTA routes crypto-specific
    questions to a human at Lanka.tax — the area is too fact-specific
    and too fast-changing for AI to give definitive answers.
  tags: [crypto, capital gains, bitcoin, tax, investment]
  source_refs: []
