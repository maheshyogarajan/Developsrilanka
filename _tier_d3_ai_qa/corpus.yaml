# FIESTA AI Q&A corpus — Tier D3 / D1 (2026-05-24)
#
# 40 Q&A entries grounded in:
#  - PN/IT/2025/01 (foreign income 15% rule, effective 1 April 2025)
#  - Inland Revenue (Amendment) Act 2025 (residency, brackets, qualifying payments)
#  - Personal relief Rs 1.8M, progressive brackets to 36%
#  - FIESTA-specific flows (calculator, evidence pack, A&L, return PDF)
#  - DTA basics + foreign tax credit
#
# Entry schema:
#   - q:           customer-phrased question (string)
#   - a:           direct answer in plain English (string, ~80-300 words)
#   - tags:        retrieval keywords (list)
#   - source_refs: support_kb files OR section refs the answer was derived from
#
# AUTHOR NOTE: This file is hand-curated. The retrieval layer (ai_qa.py)
# treats q + tags as the search space. Edit the corpus when an answer is
# wrong — do not edit the retrieval logic.

- q: "I'm a Sri Lankan dev earning $2,500/mo from a US client. How much tax will I pay?"
  a: |
    Under the new rules effective 1 April 2025, if you remit your foreign earnings
    through a licensed Sri Lankan bank, you pay a flat 15% final tax on the
    remitted amount. So on roughly Rs 9.0L/month (Rs 108L/yr at ~Rs 300/USD),
    your tax would be around Rs 16.2L/yr after applying the Rs 1.8M personal
    relief — about Rs 241K. If you instead keep the money offshore or in a
    Payoneer card and don't remit through a bank, the income falls under the
    standard progressive brackets that go up to 36%, and the bill rises to
    roughly Rs 540K. The "remit via SL bank" path saves roughly Rs 299K/yr.
    Use the FIESTA calculator to model your exact remittance pattern — these
    numbers shift based on your actual monthly amounts and FX rates.
  tags: [foreign income, 15%, dev, USD, US client, calculator, remittance, bank]
  source_refs: [pn_it_2025_01_overview.md]

- q: "What's the 15% foreign income tax rule?"
  a: |
    Practice Note IT/2025/01, effective 1 April 2025, applies a 15% final
    withholding tax on foreign-sourced income that is remitted to Sri Lanka
    through a licensed commercial bank. "Final" means once that 15% is paid,
    the income is not added to your other income for progressive-bracket
    calculation. The rule was designed to encourage remittance through formal
    banking channels (vs. offshore wallets or Payoneer cards). To qualify,
    the income must be (a) foreign-sourced (paid by a non-resident, for
    services rendered or assets located outside SL), (b) remitted via an SL
    bank account in your name, and (c) declared in your annual return.
    Income NOT remitted through banks falls under standard progressive
    rates up to 36%.
  tags: [15%, foreign income, PN IT 2025 01, final tax, remittance, rule]
  source_refs: [pn_it_2025_01_overview.md]

- q: "What's the difference between remitted and non-remitted foreign income?"
  a: |
    Remitted = the foreign currency arrives in a Sri Lankan bank account in
    your name. Non-remitted = the money stays offshore (foreign bank,
    Payoneer card, crypto wallet) or is converted in-country via informal
    channels. Tax treatment is very different:
    - REMITTED via SL bank: flat 15% final tax (PN/IT/2025/01).
    - NON-REMITTED or routed outside the banking system: standard
      progressive rates up to 36%, plus the income is added to your other
      income for bracket calculation.
    The bank's inward-remittance certificate is the evidence IRD wants.
    Without it, IRD's default position is to treat the income as
    non-remitted and apply progressive rates.
  tags: [remitted, non-remitted, foreign income, 15%, progressive, Payoneer, bank]
  source_refs: [pn_it_2025_01_overview.md]

- q: "Am I a Sri Lankan tax resident? What's the 183-day rule?"
  a: |
    Under the Inland Revenue Act, you are a Sri Lankan tax resident for a
    year of assessment if you are physically present in Sri Lanka for 183
    days or more in any rolling 12-month period that ends in that year.
    Days of arrival and departure both count. Residency is determined per
    year of assessment (1 April to 31 March in SL).
    Consequences of residency:
    - Resident: taxed on WORLDWIDE income, with reliefs (personal relief
      Rs 1.8M, qualifying payment deductions, DTA credits).
    - Non-resident: taxed only on Sri Lanka-sourced income; no personal
      relief; flat or withholding rates on certain income classes.
    If you're a returnee crossing the 183-day threshold mid-year, plan the
    timing carefully — once you tip into resident status, your foreign
    income for the FULL year of assessment becomes taxable.
  tags: [residency, 183 days, resident, non-resident, returnee, worldwide income]
  source_refs: []

- q: "What is the personal relief?"
  a: |
    Personal relief is a flat Rs 1,800,000 (Rs 1.8M) deduction available
    to every Sri Lankan tax resident, applied against total assessable
    income before tax brackets are computed. This means the first Rs 1.8M
    of your income is effectively tax-free.
    It applies once per taxpayer per year of assessment. You don't claim it
    separately — it's automatic if you're a resident filing a return.
    Non-residents do not get personal relief.
  tags: [personal relief, 1.8M, deduction, resident, tax free, threshold]
  source_refs: []

- q: "What are the current tax brackets?"
  a: |
    Sri Lanka progressive personal income tax brackets (Year of Assessment
    2025/26, after personal relief of Rs 1.8M):
    - First Rs 1,000,000 of taxable income: 6%
    - Next Rs 500,000: 18%
    - Next Rs 500,000: 24%
    - Next Rs 500,000: 30%
    - Balance: 36%
    Foreign income remitted via licensed SL bank is taxed at a flat 15%
    final rate, OUTSIDE the progressive brackets above (PN/IT/2025/01).
    Brackets are applied to your taxable income (gross income LESS personal
    relief LESS qualifying payment deductions).
  tags: [brackets, rates, progressive, 6%, 18%, 24%, 30%, 36%, 2025/26]
  source_refs: []

- q: "What are qualifying payments?"
  a: |
    Qualifying payments are specific categories of expenditure the Inland
    Revenue Act lets you deduct from your assessable income BEFORE applying
    tax brackets. The most common ones are:
    - Approved donations (registered charities, certain government funds).
    - Solar panel installation expenses (subject to limits and conditions).
    - Life insurance premiums (capped).
    - Medical insurance premiums (capped).
    - Certain housing loan interest payments (subject to caps and
      eligibility).
    - Contributions to approved provident funds beyond mandatory.
    Documentation is required (receipts, registration certificates of the
    payee, bank statement showing the payment). FIESTA's deductions module
    walks you through which payments qualify and what evidence to upload.
  tags: [qualifying payments, deductions, donations, solar, insurance, evidence]
  source_refs: [evidence_pack_requirements.md]

- q: "What is the A&L declaration?"
  a: |
    A&L (Assets and Liabilities) is a separate IRD declaration listing
    everything you own (assets — property, vehicles, bank balances,
    investments, etc.) and everything you owe (liabilities — loans,
    mortgages, outstanding tax) as at the end of the year of assessment.
    The A&L is required for high-income individuals and for anyone whose
    return triggers IRD's threshold rules. It is filed alongside (but
    separate from) the income tax return. The A&L is a STATEMENT, not a
    tax calculation — it doesn't add to or reduce your tax liability
    directly. Its purpose is wealth-tracking for IRD audit selection.
    FIESTA will pre-populate your A&L draft from data already in the
    profile (bank statements, property records) so you only have to
    verify and add anything missing.
  tags: [A&L, assets, liabilities, declaration, high income, IRD filing, wealth]
  source_refs: []

- q: "When is the tax return filing deadline?"
  a: |
    The Sri Lankan personal income tax return is due by 30 November
    following the end of the year of assessment (1 April to 31 March).
    So for Year of Assessment 2025/26 (period 1 April 2025 to 31 March
    2026), the return is due 30 November 2026.
    Tax payment deadlines are separate:
    - Quarterly installment dates: 15 August, 15 November, 15 February,
      15 May (for the year of assessment that ends 31 March of the
      payment year).
    - Final balance payment: by 30 September following the year-end.
    Late filing or late payment triggers penalties (typically a percentage
    of the tax due plus interest). File the return on time even if you
    cannot pay in full — penalties for late filing are heavier than
    penalties for late payment.
  tags: [deadline, filing date, 30 November, return due, quarterly, payment dates]
  source_refs: []

- q: "How do I file my return through FIESTA?"
  a: |
    FIESTA walks you through filing in four steps:
    1. Complete your profile (personal info, residency, employer details).
    2. Upload your evidence pack (bank statements, foreign tax certificates,
       qualifying payment receipts) via the documents section.
    3. Review the auto-computed tax bill — FIESTA shows your taxable income,
       applied brackets, qualifying payment deductions, and final tax due.
    4. Download the IRD-ready PDF return and submit it to IRD via your
       RAMIS portal (or hand off to a Lanka.tax filer who can submit on
       your behalf).
    FIESTA does NOT submit directly to IRD on your behalf in MVP — you
    download the PDF and submit yourself, or hand off to Lanka.tax. We're
    building the direct-submit integration for a later release.
  tags: [how to file, FIESTA, return, PDF, RAMIS, IRD, submit, four steps]
  source_refs: [lanka_tax_handoff.md]

- q: "What evidence does IRD need?"
  a: |
    For a complete return, IRD expects evidence for every income and
    deduction line item. The standard evidence pack:
    - Income: bank statements (inward remittances), foreign tax
      certificates (if claiming DTA credit), employer tax certificates
      (T-10 for employment income), invoices (for business income), rental
      agreements, broker statements (for investment income).
    - Deductions: receipts for qualifying payments (donations, insurance
      premiums, solar installation, etc.), registration certificates of
      the payee.
    - Identity: NIC, PIN certificate, TIN registration confirmation.
    - A&L (if required): bank balance confirmations, vehicle registration,
      property deeds, investment account statements.
    FIESTA's evidence module tells you exactly which docs are missing
    based on your profile. Upload them once, reference them across years.
  tags: [evidence, IRD, documents, T-10, bank statement, qualifying payment, A&L]
  source_refs: [evidence_pack_requirements.md]

- q: "What is a DTA and can I claim foreign tax credit?"
  a: |
    A Double Taxation Avoidance (DTA) agreement is a bilateral treaty that
    prevents the same income from being taxed twice — once in the source
    country and again in Sri Lanka. SL has DTAs with ~40 countries including
    the US, UK, Australia, Canada, UAE, Singapore, Germany, Netherlands,
    India, Malaysia.
    If foreign tax was WITHHELD AT SOURCE on income that is also taxable in
    SL, you may claim that foreign tax as a credit against your SL tax
    liability on the same income — up to the SL tax on that income (excess
    foreign tax is NOT refundable in SL).
    Evidence needed: foreign tax certificate (US W-2 / 1099, UK P60/P45,
    Australian PAYG summary, etc.) plus the relevant DTA article.
    Self-employed / freelance income usually has NO foreign tax withheld —
    if no foreign tax was paid, there's nothing to credit. DTA questions
    are fact-specific; FIESTA will route DTA queries to a human at
    Lanka.tax.
  tags: [DTA, double taxation, foreign tax credit, withholding, treaty]
  source_refs: [dta_credit_basics.md]

- q: "I work for an Upwork client and they don't withhold tax. What do I do?"
  a: |
    This is the most common case for Sri Lankan freelancers. If no foreign
    tax was withheld, then full Sri Lankan tax applies — there is no foreign
    credit to claim (you can't credit tax you didn't pay).
    Tax path depends on remittance:
    - Remit Upwork payments via SL bank: 15% final tax under PN/IT/2025/01.
    - Keep on Payoneer / offshore / informal channels: progressive rates
      up to 36%.
    Either way, you must declare the gross income (the amount your client
    paid you, not the post-Upwork-fee amount) on your return.
    Recommended: have Upwork wire payments to your SL commercial bank
    account. The 15% path is strongly more favourable, and the bank's
    inward-remittance certificate is the evidence IRD wants.
  tags: [Upwork, freelance, no withholding, foreign income, 15%, remittance]
  source_refs: [pn_it_2025_01_overview.md]

- q: "I get paid in crypto. How is that taxed?"
  a: |
    Cryptocurrency income is treated as foreign-sourced income if the
    payer is non-resident. The hard question is REMITTANCE: until the
    crypto is converted to LKR and arrives in an SL bank account, it
    cannot benefit from the 15% PN/IT/2025/01 path. While it sits in a
    crypto wallet, it's "non-remitted" — progressive rates apply on the
    LKR-equivalent value at the date you became entitled to it.
    To claim 15%: (1) convert crypto to USD/EUR via a regulated exchange,
    (2) wire to your SL bank account, (3) keep the exchange statement plus
    the bank's inward-remittance certificate as evidence.
    Crypto tax in SL is an evolving area. FIESTA routes crypto-specific
    questions to a human at Lanka.tax for a fact-specific opinion.
  tags: [crypto, cryptocurrency, bitcoin, ethereum, foreign income, remittance, 15%]
  source_refs: []

- q: "I'm a returnee from Dubai. What do I owe?"
  a: |
    The trigger is the 183-day test: once you've been physically present in
    SL for 183 days in any rolling 12-month period ending in the year of
    assessment, you become a SL tax resident for that whole year — and your
    WORLDWIDE income for that year becomes taxable in SL.
    Specific to UAE returnees: the UAE has no personal income tax, so any
    UAE-source income you bring back will not have foreign tax credit
    attached (nothing to credit). However, the UAE-SL DTA still affects
    classification of the income.
    Strategy points:
    - If you can defer SL re-entry to AFTER 1 April (start of new year of
      assessment), do it — your UAE income before re-entry stays
      non-SL-taxable.
    - Plan remittance carefully: bringing accumulated UAE savings into an
      SL bank account post-residency triggers the 15% on the income
      portion (NOT on capital — only on income earned after you became
      resident).
    - Document your residency clearly: visa stamps, ticket dates, UAE
      employment contracts, account statements.
    FIESTA's diaspora module is designed for exactly this case. Returnees
    often have the highest savings under FIESTA's optimization — typically
    Rs millions, not thousands.
  tags: [returnee, diaspora, Dubai, UAE, 183 days, residency, worldwide income]
  source_refs: []

