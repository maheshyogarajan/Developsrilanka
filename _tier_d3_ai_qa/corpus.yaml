  a: |
    The FIESTA MVP calculator (https://fiesta-mvp.fly.dev) is free to use,
    no signup required for the calculator. Computing your tax bill,
    modeling remittance scenarios, and previewing the savings under the
    new 15% rule — all free.
    Paid tiers cover:
    - Filing-ready PDF generation (IRD-formatted return).
    - Evidence pack management (upload, organize, reuse year-over-year).
    - Lanka.tax handoff (a human filer submits to IRD on your behalf).
