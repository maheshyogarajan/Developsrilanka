- q: "Do I need a TIN to file?"
  a: |
    Yes. Every Sri Lankan tax filer needs a Taxpayer Identification Number
    (TIN), issued by IRD. Without a TIN you cannot file a return.
    To register: visit ird.gov.lk or your nearest IRD office with your
    NIC and proof of address. New TIN issuance typically takes 7-14 days.
    You also need a PIN (Personal Identification Number) to log into the
    RAMIS portal for online filing.
    FIESTA can prepare your return without a TIN (for calculator
    purposes), but you'll need both TIN and PIN to actually submit to
    IRD. If you don't have either, Lanka.tax can help with the
    registration as a separate engagement.
  tags: [TIN, PIN, registration, RAMIS, IRD, filing, prerequisite]
  source_refs: []

- q: "What is RAMIS?"
  a: |
    RAMIS is the Revenue Administration Management Information System —
    IRD's online portal for tax filing, payment, and account management.
    You log in with your TIN + PIN at https://ramis.ird.gov.lk.
    From RAMIS you can: file returns electronically, pay tax online,
    check your tax account history, generate tax clearance certificates,
    and download IRD-issued forms.
    FIESTA produces an IRD-ready PDF return that you upload to RAMIS
    (or print and submit physically at an IRD office). Direct RAMIS
    integration is on the FIESTA roadmap.
  tags: [RAMIS, portal, IRD, online filing, TIN, PIN]
  source_refs: []

- q: "What if I have employment income AND foreign income?"
  a: |
    Each income stream is taxed under its own regime, then totalled for
    your return:
    - Employment income (from an SL employer): standard progressive
      rates up to 36%, after personal relief (Rs 1.8M) is applied
      against TOTAL income (not per stream).
    - Foreign income REMITTED via SL bank: flat 15% final tax. Does NOT
      enter the progressive bracket calculation.
    - Foreign income NOT remitted: progressive rates, added to your
      employment income for bracket purposes.
    Personal relief is applied once, against your total non-foreign-15%
    income. So you don't "double-dip" the relief, but you DO get the
    benefit of the 15% final rate on your foreign-remitted portion AND
    the bracket structure on your employment portion.
    FIESTA's calculator handles the split automatically — enter both
    income streams and it shows the combined tax.
  tags: [employment, foreign, mixed income, T-10, calculator, brackets, 15%]
  source_refs: [pn_it_2025_01_overview.md]

- q: "Can I deduct solar panel installation costs?"
  a: |
    Yes, solar panel installation for your residence is a qualifying
    payment under the Inland Revenue Act, subject to limits and conditions:
    - The system must be installed at your primary residence (not a
      rental or commercial property).
    - Deduction is capped (current cap: confirm against the latest IRD
      guidance — FIESTA shows the live figure in the deductions module).
    - Evidence required: invoice from a registered installer, payment
      proof (bank transfer or card receipt), and the connection
      certificate from CEB or LECO confirming the system is operational
      and grid-connected.
    Upload these documents in FIESTA's deductions module and the
    deduction will be applied automatically to your tax computation.
  tags: [solar, qualifying payment, deduction, panels, residence, evidence]
  source_refs: []

- q: "How do bank statements get into FIESTA?"
  a: |
    Three options:
    1. Upload PDF statements directly from your online banking. FIESTA
       parses them and extracts inward remittances, deductible payments,
       and balance data.
    2. CSV export from your bank's online portal. Most SL banks (Sampath,
       Commercial, HNB, DFCC, NDB) export CSV — upload it and FIESTA
       maps the columns.
    3. Manual entry for one-off transactions (e.g. a single inward
       remittance you want to declare without uploading a full statement).
    Foreign-currency statements (USD, EUR, GBP) are supported — FIESTA
    converts at the relevant CBSL middle rate for the transaction date.
    See the bank statement import help in the support kb for details on
    each bank's export format.
  tags: [bank statement, import, upload, PDF, CSV, manual, CBSL]
  source_refs: [bank_statement_import_help.md, cbsl_middle_rate_rule.md]

- q: "Which exchange rate does FIESTA use?"
  a: |
    FIESTA uses the Central Bank of Sri Lanka (CBSL) daily middle rate
    for each transaction date — this is the rate IRD requires for tax
    computation. CBSL publishes daily middle rates on cbsl.gov.lk.
    For example, a USD inward remittance on 15 May 2026 is converted at
    the CBSL middle rate published on 15 May 2026 (not the rate your bank
    actually gave you, and not today's rate).
    If the CBSL rate is unavailable for a specific date (weekend, public
    holiday), FIESTA uses the next available trading day's rate. The
    rate basis is shown alongside each remittance in the audit module so
    you can verify it before filing.
  tags: [exchange rate, CBSL, middle rate, FX, conversion, USD]
  source_refs: [cbsl_middle_rate_rule.md, cbsl_rate_lookup_failure.md]

- q: "What is the difference between gross and net income for tax purposes?"
  a: |
    For Sri Lankan tax purposes:
    - GROSS income = total amount earned before any deductions.
      For employment: full salary BEFORE PAYE / EPF / ETF / advance tax.
      For freelance: full client invoice amount BEFORE platform fees
      (Upwork / Fiverr commissions), payment processor fees, etc.
    - NET income = gross less certain allowable expenses (for business
      income) OR gross less specific statutory items.
    For PERSONAL income tax (employment, foreign income), you declare
    GROSS. Platform fees and payment-processor fees on freelance income
    are NOT deductible at the personal-income-tax level.
    For BUSINESS income (where you're operating as a sole proprietor or
    company), you declare net of allowable business expenses (cost of
    sales, operating expenses, etc.) — different rules apply, see business
    tax guides.
  tags: [gross, net, income, freelance, Upwork fees, deductions]
  source_refs: []

- q: "I'm a salaried employee in Sri Lanka. Do I even need to file?"
  a: |
    If your only income is employment income from a single SL employer who
    operates the APIT (Advance Personal Income Tax) system correctly, your
    tax is withheld at source and you may not need to file a return — IRD
    treats the APIT as final for many salaried employees below specific
    income thresholds.
    However, you SHOULD file (and probably MUST file) if any of these apply:
    - Total income (employment + other) exceeds Rs 1.8M annually.
    - You have foreign income, even small amounts.
    - You have rental income, investment income, freelance income, or
      consultancy income.
    - You want to claim qualifying payment deductions (insurance,
      donations, solar, etc.) that weren't applied by your employer.
    - You changed jobs mid-year (APIT may not be correctly aggregated).
    - Your employer is foreign or doesn't operate APIT.
    When in doubt, file. The penalty for NOT filing when you should is
    much harsher than the cost of filing.
  tags: [salaried, employee, APIT, do I need to file, threshold, employment only]
  source_refs: []

- q: "What if I missed the deadline?"
  a: |
    Late filing of an income tax return triggers a penalty: typically a
    percentage of the tax due (current statutory penalty — check IRD's
    latest schedule via FIESTA's compliance module for the live figure),
    plus interest on any unpaid tax accruing from the original due date.
    File ASAP even if you're already past the deadline — penalties compound
    over time, and a filed return (even late) stops the clock on the
    most punitive "non-filer" classification.
    If you have a reasonable cause for the late filing (medical emergency,
    bereavement, IRD system outage with documentation, etc.), you can
    submit a written request for penalty waiver alongside the return.
    IRD considers these case by case.
    FIESTA can prepare and file a late return the same as an on-time one.
    The penalty calculation is shown separately in your tax bill so you
    know what to expect.
  tags: [late filing, penalty, missed deadline, interest, waiver]
  source_refs: []

- q: "Can FIESTA file my return with IRD directly?"
  a: |
    Not in MVP. FIESTA prepares an IRD-ready PDF that you (or a Lanka.tax
    filer) upload to RAMIS or submit physically at an IRD office.
    Roadmap items toward direct submission:
    - RAMIS API integration (depends on IRD opening the API for
      third-party software — work in progress with IRD's tech team).
    - Lanka.tax handoff: for users who don't want to submit themselves,
      we offer a paid handoff where a Lanka.tax filer submits on your
      behalf using their TIN-PIN authorisation. See lanka_tax_handoff.md
      in the support kb for the process.
    For now, the PDF download is your filing artifact — print it, sign
    it, and submit by 30 November.
  tags: [auto file, direct submit, RAMIS API, Lanka.tax, handoff, PDF]
  source_refs: [lanka_tax_handoff.md]

- q: "I run a small business. Does FIESTA cover business tax?"
  a: |
    FIESTA MVP focuses on PERSONAL income tax — employment income,
    foreign-sourced personal income, freelance / consultancy income
    declared in your personal name, investment income, rental income.
    Business income for the FIESTA scope means sole-proprietor income
    you declare on your personal return (Schedule II equivalent). For
    incorporated companies, partnerships, or businesses with VAT
    registration, you need a corporate/business tax solution — FIESTA
    will route you to Lanka.tax for a separate engagement, or you can
    use IRD's RAMIS portal directly.
    Specifically out of scope for FIESTA MVP:
    - Corporate income tax filings.
    - VAT returns.
    - SSCL returns.
    - Withholding tax returns (where you're the withholder).
    - Payroll / APIT operation (as an employer).
  tags: [business, corporate, sole proprietor, VAT, scope, FIESTA limits]
  source_refs: []

- q: "How does FIESTA handle multiple foreign clients?"
  a: |
    FIESTA aggregates all foreign-sourced income across all clients into
    a single foreign-income line on your return. You can:
    - Upload bank statements showing all inward remittances together —
      FIESTA classifies each by counterparty.
    - Tag each remittance with the source client name (for your records
      and audit trail; IRD only sees the total).
    - Mix currencies: USD client + EUR client + GBP client all coexist
      in your foreign-income summary, each converted at the relevant
      CBSL middle rate on its remittance date.
    The 15% final tax (if you remitted via SL bank) applies to the total
    foreign-remitted amount — not per client.
  tags: [multiple clients, aggregation, foreign income, multiple currencies]
  source_refs: []

- q: "Where is my data stored?"
  a: |
    FIESTA stores your data on infrastructure hosted in the EU (Fly.io
    region: cdg). Your tax data, uploaded documents, and account
    information are encrypted at rest and in transit. Access is limited
    to your account (logged-in user) and authorised support staff acting
    on a CEO-approved audit ticket.
    We do NOT share your data with IRD or any third party without your
    explicit consent — you generate the PDF return and you submit it.
    See the privacy policy at fiesta-mvp.fly.dev/privacy for the full
    data handling statement.
  tags: [data, storage, privacy, security, GDPR, hosting]
  source_refs: []

- q: "Can I edit my answer after I've submitted?"
  a: |
    Within FIESTA, yes — your profile and uploaded evidence are editable
    at any time before you generate the final PDF. Once you regenerate
    the PDF, the new version replaces the previous one and your tax
    computation updates.
    Once you've SUBMITTED to IRD (either via RAMIS or physically), to
    change the return you must file an AMENDED return through IRD's
    official amendment process. FIESTA can prepare an amended version
    showing the original and the corrected figures, but the actual
    amendment submission goes through IRD.
  tags: [edit, amend, change, after filing, RAMIS, amended return]
  source_refs: []

- q: "What does 'audit trail' mean in FIESTA?"
  a: |
    Every income line, deduction, and tax computation in FIESTA is backed
    by source evidence (a bank statement line item, an uploaded receipt, a
    foreign tax certificate, etc.). The audit trail is the linkage:
    given any number on your return, you can click through to see exactly
    which source documents and which transaction lines produced it.
    Why it matters: if IRD audits your return (random selection or
    triggered audit), the auditor will ask "where did this Rs X come
    from?". With an audit trail, the answer is one click away — you
    show them the bank line, the FX rate, the conversion. Without an
    audit trail, you're rebuilding the calculation from raw records
    months or years after the fact.
    FIESTA's audit trail is a free feature on all tiers, including the
    MVP calculator.
  tags: [audit, audit trail, evidence, lineage, source, IRD audit]
  source_refs: []

- q: "What is APIT?"
  a: |
    APIT = Advance Personal Income Tax. It's the Sri Lankan equivalent of
    PAYE (pay-as-you-earn). Your employer withholds APIT from your salary
    each month and remits it to IRD on your behalf, based on tables
    published by IRD.
    APIT is an ADVANCE on your annual income tax — when you file your
    return, the total APIT withheld is credited against your total tax
    liability. If APIT > tax due, you get a refund (slow, via IRD). If
    APIT < tax due (because of other income, e.g. foreign income), you
    pay the balance.
    Common cause of APIT under-withholding:
    - You have a second job or freelance income on the side.
    - You have qualifying payments your employer didn't apply.
    - Your employer doesn't operate APIT correctly (foreign employer, or
      a small employer).
    FIESTA reconciles your APIT (from your T-10 certificate) against
    total tax due and shows the balance to pay or refund to claim.
  tags: [APIT, PAYE, withholding, employer, T-10, advance tax]
  source_refs: []

- q: "Where is the calculator?"
  a: |
    The FIESTA calculator is the home page: https://fiesta-mvp.fly.dev.
    No signup required — enter your foreign monthly income, remittance
    pattern, and any other income, and you'll get an immediate tax bill
    estimate with the breakdown by income type and bracket.
    To save your scenarios, upload evidence, and generate a filing-ready
    PDF, you sign up — but the calculator itself is open.
