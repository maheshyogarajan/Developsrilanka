# fly.toml — FIESTA app on Fly.io Mumbai (bom)
# Generated by SUB-C (INFRA) 2026-05-16

app = "fiesta-mvp"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# ── Web process ───────────────────────────────────────────────────────────────
[processes]
  # Bundle C (2026-05-22 perf): -w 4 --preload — 4 workers share preloaded app
  # imports (faster spawn, lower per-worker memory). Requires the 1024MB bump
  # in [[vm]] below; would OOM on 512MB.
  app    = "gunicorn -w 4 --preload -b 0.0.0.0:8080 --timeout 120 --access-logfile - wsgi:app"
  worker = "celery -A celery_config worker --loglevel=info --concurrency=2 --without-gossip --without-mingle --pool=prefork"
  beat   = "celery -A celery_config beat --loglevel=info"

# ── HTTP service (web process only) ──────────────────────────────────────────
[[services]]
  protocol    = "tcp"
  internal_port = 8080
  processes   = ["app"]

  [[services.ports]]
    port     = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval    = "15s"
    timeout     = "5s"
    grace_period = "20s"
    method      = "GET"
    path        = "/healthz"
    protocol    = "http"

# ── VM sizing ─────────────────────────────────────────────────────────────────
# Bundle A+B+C applied 2026-05-22 (TTFB was ~3s on shared-cpu-1x/512MB):
#   A: shared-cpu-2x + 1024MB → more CPU + RAM headroom
#   B: auto_stop=false, min_machines_running=2 → no cold starts on app group
#   C: gunicorn -w 4 --preload (in [processes] above)
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 2
  processes           = ["app"]

# App group VM: bumped for the bundle. Worker + beat groups use the default
# fly.toml VM size — they're not the bottleneck and stay on shared-cpu-1x/512MB
# via per-process [[vm]] overrides below.
[[vm]]
  size       = "shared-cpu-2x"
  memory     = "1024mb"
  processes  = ["app"]

[[vm]]
  size       = "shared-cpu-1x"
  memory     = "512mb"
  processes  = ["worker", "beat"]
