# fly.toml — FIESTA app on Fly.io Mumbai (bom)
# Generated by SUB-C (INFRA) 2026-05-16

app = "fiesta-mvp"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# ── Web process ───────────────────────────────────────────────────────────────
[processes]
  app    = "gunicorn -w 2 -b 0.0.0.0:8080 --timeout 120 --access-logfile - wsgi:app"
  worker = "celery -A celery_config worker --loglevel=info --concurrency=2 --without-gossip --without-mingle --pool=prefork"
  beat   = "celery -A celery_config beat --loglevel=info"

# ── HTTP service (web process only) ──────────────────────────────────────────
[[services]]
  protocol    = "tcp"
  internal_port = 8080
  processes   = ["app"]

  [[services.ports]]
    port     = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval    = "15s"
    timeout     = "5s"
    grace_period = "20s"
    method      = "GET"
    path        = "/healthz"
    protocol    = "http"

# ── VM sizing ─────────────────────────────────────────────────────────────────
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
